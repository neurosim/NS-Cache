# Question 8: transfer width at fixed mat dimensions.
# Run from the repository root.
# Edit only the two lines below, together. Default: 128 bits and mux 8.
# Allowed pairs (word width, output mux level 2): (128, 8), (256, 4), (512, 2), (1024, 1).
-WordWidth (bit): 128
-ForceMuxOutputLev2: 8

# Fixed settings: keep these unchanged.
-DesignTarget: RAM
-ProcessNode: 14
-DeviceRoadmap: LOP
-Capacity (MB): 1
-MemoryCellInputFile: lab/cells/SRAM_cell_14nm.cell
-Temperature (K): 300
-Routing: H-tree
-InternalSensing: true
-LocalWireType: LocalAggressive
-LocalWireRepeaterType: RepeatedOpt
-LocalWireUseLowSwing: No
-GlobalWireType: GlobalAggressive
-GlobalWireRepeaterType: RepeatedOpt
-GlobalWireUseLowSwing: No
-OptimizationTarget: ReadLatency
-EnablePruning: No
-BufferDesignOptimization: latency
-ForceBank (Total AxB, Active CxD): 4x4, 1x2
-ForceSubArray (Total AxB, Active CxD): 2x2, 1x2
-ForceMuxSenseAmp: 1
-ForceMuxOutputLev1: 1
-BankAspectRatioLimit: 3
-RelaxSRAMCell: true
-M3DMemory: false
-StackedDieCount: 1
-PartitionGranularity: 0
-LocalTSVProjection: 0
-GlobalTSVProjection: 0
-TSVRedundancy: 1.0
