# Questions 1-2: mat shape and mux placement.
# Run from the repository root.
# Edit only the three mux lines below. Default: case A.
# Case | Sense-amp mux | Output mux level 1 | Output mux level 2
# A    | 1             | 2                  | 1
# B    | 1             | 4                  | 1
# C    | 1             | 8                  | 1
# D    | 2             | 2                  | 1
# E    | 4             | 1                  | 1
-ForceMuxSenseAmp: 1
-ForceMuxOutputLev1: 2
-ForceMuxOutputLev2: 1

# Fixed settings: keep these unchanged.
-DesignTarget: RAM
-ProcessNode: 14
-DeviceRoadmap: LOP
-WordWidth (bit): 64
-MemoryCellInputFile: lab/cells/SRAM_cell_14nm.cell
-Temperature (K): 300
-Routing: H-tree
-InternalSensing: true
-LocalWireType: LocalAggressive
-LocalWireRepeaterType: RepeatedOpt
-LocalWireUseLowSwing: No
-GlobalWireType: GlobalAggressive
-GlobalWireRepeaterType: RepeatedOpt
-GlobalWireUseLowSwing: No
-OptimizationTarget: ReadLatency
-EnablePruning: No
-BufferDesignOptimization: latency
-ForceBank (Total AxB, Active CxD): 1x1, 1x1
-ForceSubArray (Total AxB, Active CxD): 1x1, 1x1
-BankAspectRatioLimit: 0
-RelaxSRAMCell: true
-M3DMemory: false
-StackedDieCount: 1
-PartitionGranularity: 0
-LocalTSVProjection: 0
-GlobalTSVProjection: 0
-TSVRedundancy: 1.0
-Capacity (KB): 8
