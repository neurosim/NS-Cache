site_name: NS-Cache
site_description: Early exploration of cache memories in advanced technology nodes
site_url: !ENV READTHEDOCS_CANONICAL_URL
repo_url: https://github.com/neurosim/NS-Cache
repo_name: neurosim/NS-Cache
edit_uri: edit/main/docs/

theme:
  name: readthedocs

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - admonition

nav:
  - Overview: index.md
  - Starter Guide:
      - Running NS-Cache: getting-started.md
      - Configuration: configuration.md
  - Architecture:
      - DESTINY inheritance and objects: architecture.md
      - Functional model and results: functionality.md
  - Programmer's Guide:
      - Overview: code-reference/index.md
      - Execution and lifecycle: code-reference/execution.md
      - Configuration and devices: code-reference/devices.md
      - Array hierarchy: code-reference/hierarchy.md
      - Peripheral circuits: code-reference/peripherals.md
      - Interconnects: code-reference/interconnects.md
      - Results and reporting: code-reference/results.md
  - Technology Models:
      - Monolithic 3D: models/monolithic-3d.md
      - Transistor technology: models/transistor-technology.md
      - AOS devices: models/aos.md
  - References:
      - Papers and model sources: references.md
