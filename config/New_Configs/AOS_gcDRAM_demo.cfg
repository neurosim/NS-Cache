# Synthetic AOS functionality demo, not a calibrated technology configuration.
# Run from the repository root: ./nsc config/New_Configs/AOS_gcDRAM_demo.cfg
# The forced 8 x 1024 data MAT makes the independent read/write paths easy to inspect.
# 45 nm selects demo peripheral tables; it does not identify an AOS process node.

-DesignTarget: RAM
-ProcessNode: 45
-Capacity (B): 1024
-WordWidth (bit): 1024
-DeviceRoadmap: HP

-LocalWireType: LocalAggressive
-LocalWireRepeaterType: RepeatedNone
-LocalWireUseLowSwing: No
-GlobalWireType: GlobalAggressive
-GlobalWireRepeaterType: RepeatedNone
-GlobalWireUseLowSwing: No

-Routing: Non-H-tree
-InternalSensing: true
-MemoryCellInputFile: config/New_Configs/AOS_gcDRAM_demo.cell
-Temperature (K): 300

-BankAspectRatioLimit: 0
-DRAMTargetResidualRatio: 0.10
-OptimizationTarget: ReadLatency
-EnablePruning: No
-ViewMatStatistics: true
-BufferDesignOptimization: balanced

-StackedDieCount: 1
-PartitionGranularity: 0
-LocalTSVProjection: 0
-GlobalTSVProjection: 0
-TSVRedundancy: 1.0

-ForceBank (Total AxB, Active CxD): 1x1, 1x1
-ForceSubArray (Total AxB, Active CxD): 1x1, 1x1
-ForceMatSize (Rows x Columns): 8 x 1024
-ForceMuxSenseAmp: 1
-ForceMuxOutputLev1: 1
-ForceMuxOutputLev2: 1
