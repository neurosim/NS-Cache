# Legacy-oracle-derived AOS demo; the original source .cell is unavailable.
# Logged device values are rounded, and full cell/system calibration is unverified.
# Run from the repository root: ./nsc config/New_Configs/AOS_eDRAM_demo.cfg
# The forced 512 x 128 data MAT keeps this example small and reproducible.
# 14 nm LOP matches the supply context of the preserved native AOS run logs.
# Above-Vdd boost/negative hold biases are accepted; level-shifter overhead is absent.

-DesignTarget: RAM
-ProcessNode: 14
-Capacity (B): 8192
-WordWidth (bit): 128
-DeviceRoadmap: LOP

-LocalWireType: LocalAggressive
-LocalWireRepeaterType: RepeatedNone
-LocalWireUseLowSwing: No
-GlobalWireType: GlobalAggressive
-GlobalWireRepeaterType: RepeatedNone
-GlobalWireUseLowSwing: No

-Routing: Non-H-tree
-InternalSensing: true
-MemoryCellInputFile: config/New_Configs/AOS_eDRAM_demo.cell
-Temperature (K): 300

-BankAspectRatioLimit: 0
-DRAMTargetResidualRatio: 0.10
-OptimizationTarget: ReadLatency
-EnablePruning: No
-ViewMatStatistics: true
-BufferDesignOptimization: latency

-StackedDieCount: 1
-PartitionGranularity: 0
-LocalTSVProjection: 0
-GlobalTSVProjection: 0
-TSVRedundancy: 1.0

-ForceBank (Total AxB, Active CxD): 1x1, 1x1
-ForceSubArray (Total AxB, Active CxD): 1x1, 1x1
-ForceMatSize (Rows x Columns): 512 x 128
-ForceMuxSenseAmp: 1
-ForceMuxOutputLev1: 1
-ForceMuxOutputLev2: 1
